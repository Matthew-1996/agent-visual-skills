<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地信息图模板</title>
<style>
  :root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#bfc0c0; --accent:#eb6c36; --link:#2e5aa8; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:var(--ink); background:var(--paper); } * { box-sizing:border-box; } body { margin:0; padding:clamp(24px,4vw,56px); } main { max-width:1180px; margin:auto; } header { max-width:820px; border-bottom:1px solid var(--rule); padding-bottom:24px; } .kicker { margin:0 0 12px; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.14em; } h1 { margin:0; font-family:"Songti SC","STSong","Noto Serif CJK SC",serif; font-size:clamp(36px,6vw,68px); line-height:1.04; letter-spacing:-.04em; } .lead { color:var(--muted); line-height:1.7; }
  .canvas { margin-top:28px; padding:clamp(14px,3vw,30px); border:1px solid var(--rule); border-radius:8px; background:#fff; } svg { display:block; width:100%; height:auto; } .notes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-top:18px; } article { border-top:1px solid var(--rule); padding-top:10px; } article strong { color:var(--accent); } article p, footer { color:var(--muted); line-height:1.55; } footer { margin-top:18px; font-size:12px; } @media(max-width:640px){.notes{grid-template-columns:1fr}}
</style>
<main>
  <header><p class="kicker">VISUAL SUMMARY · OFFLINE</p><h1>一句话讲清核心结论</h1><p class="lead">用一到两句说明读者为何需要这张信息图，以及下方结构如何支撑结论。</p></header>
  <section class="canvas">
    <svg viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
      <title id="title">中心辐射信息图模板</title><desc id="desc">一个核心主题连接三个支撑信息块。</desc>
      <rect width="1080" height="620" fill="#f5f5f5"/>
      <g fill="none" stroke="#bfc0c0" stroke-width="2"><path d="M540 310L260 175"/><path d="M540 310L820 175"/><path d="M540 310L540 500"/></g>
      <circle cx="540" cy="310" r="112" fill="#eb6c36"/><text x="540" y="300" text-anchor="middle" fill="white" font-size="28" font-weight="800">核心主题</text><text x="540" y="338" text-anchor="middle" fill="#f5f5f5" font-size="17">一句关键解释</text>
      <g fill="#fff" stroke="#bfc0c0" stroke-width="2"><rect x="120" y="100" width="280" height="150" rx="8"/><rect x="680" y="100" width="280" height="150" rx="8"/><rect x="400" y="450" width="280" height="120" rx="8"/></g>
      <g text-anchor="middle" fill="#2d3142"><text x="260" y="165" font-size="23" font-weight="800">支撑点 A</text><text x="260" y="200" fill="#4f5d75" font-size="15">事实或关键数字</text><text x="820" y="165" font-size="23" font-weight="800">支撑点 B</text><text x="820" y="200" fill="#4f5d75" font-size="15">事实或关键数字</text><text x="540" y="505" font-size="23" font-weight="800">支撑点 C</text><text x="540" y="538" fill="#4f5d75" font-size="15">事实或关键数字</text></g>
    </svg>
    <div class="notes"><article><strong>01 / 证据</strong><p>补充口径与上下文。</p></article><article><strong>02 / 含义</strong><p>解释数据代表什么。</p></article><article><strong>03 / 行动</strong><p>给出下一步或决策。</p></article></div>
  </section>
  <footer>口径：在这里注明来源、时间范围与必要限制。</footer>
</main>

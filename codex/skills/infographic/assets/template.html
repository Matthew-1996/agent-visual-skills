<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地信息图模板</title>
<style>
  :root { font-family: system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:#172033; background:#e9edf3; }
  * { box-sizing:border-box; } body { margin:0; padding:clamp(14px,3vw,36px); } main { max-width:1180px; margin:auto; background:#f8fafc; border:1px solid #d8dee9; border-radius:24px; overflow:hidden; box-shadow:0 24px 80px #26324a1c; }
  header { padding:clamp(24px,5vw,58px); border-bottom:1px solid #d8dee9; } .kicker { margin:0 0 12px; color:#006f73; font-size:12px; font-weight:800; letter-spacing:.16em; } h1 { max-width:820px; margin:0; font-size:clamp(32px,6vw,68px); line-height:1.02; letter-spacing:-.04em; } .lead { max-width:720px; margin:18px 0 0; color:#58657a; line-height:1.7; }
  .canvas { padding:clamp(16px,3vw,34px); } svg { display:block; width:100%; height:auto; border-radius:18px; } .notes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px; } article { padding:18px; border:1px solid #d8dee9; border-radius:14px; background:white; } article strong { display:block; margin-bottom:6px; color:#006f73; } article p { margin:0; color:#58657a; font-size:14px; line-height:1.55; }
  footer { padding:16px clamp(24px,5vw,58px) 26px; color:#718096; font-size:12px; }
  @media(max-width:640px){ body{padding:0} main{border:0;border-radius:0}.notes{grid-template-columns:1fr} }
</style>
<main>
  <header><p class="kicker">VISUAL SUMMARY · OFFLINE</p><h1>一句话讲清核心结论</h1><p class="lead">用一到两句说明读者为何需要这张信息图，以及下方结构如何支撑结论。</p></header>
  <section class="canvas">
    <svg viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
      <title id="title">中心辐射信息图模板</title><desc id="desc">一个核心主题连接三个支撑信息块。</desc>
      <rect width="1080" height="620" rx="24" fill="#eef2f6"/>
      <g fill="none" stroke="#8e9bad" stroke-width="2"><path d="M540 310L260 175"/><path d="M540 310L820 175"/><path d="M540 310L540 500"/></g>
      <circle cx="540" cy="310" r="112" fill="#006f73"/><text x="540" y="300" text-anchor="middle" fill="white" font-size="28" font-weight="800">核心主题</text><text x="540" y="338" text-anchor="middle" fill="#bde8e6" font-size="17">一句关键解释</text>
      <g fill="#fff" stroke="#cad2de" stroke-width="2"><rect x="120" y="100" width="280" height="150" rx="18"/><rect x="680" y="100" width="280" height="150" rx="18"/><rect x="400" y="450" width="280" height="120" rx="18"/></g>
      <g text-anchor="middle" fill="#172033"><text x="260" y="165" font-size="23" font-weight="800">支撑点 A</text><text x="260" y="200" fill="#58657a" font-size="15">事实或关键数字</text><text x="820" y="165" font-size="23" font-weight="800">支撑点 B</text><text x="820" y="200" fill="#58657a" font-size="15">事实或关键数字</text><text x="540" y="505" font-size="23" font-weight="800">支撑点 C</text><text x="540" y="538" fill="#58657a" font-size="15">事实或关键数字</text></g>
    </svg>
    <div class="notes"><article><strong>01 / 证据</strong><p>补充口径与上下文。</p></article><article><strong>02 / 含义</strong><p>解释数据代表什么。</p></article><article><strong>03 / 行动</strong><p>给出下一步或决策。</p></article></div>
  </section>
  <footer>口径：在这里注明来源、时间范围与必要限制。</footer>
</main>

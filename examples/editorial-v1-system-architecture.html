<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial V1 系统架构示例</title>
<style>
  :root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#bfc0c0; --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); --link:#2e5aa8; color-scheme:light; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:var(--ink); background:var(--paper); }
  * { box-sizing:border-box; } body { margin:0; padding:56px clamp(28px,6vw,96px); background:var(--paper); } main { max-width:1280px; margin:auto; } .kicker { margin:0 0 12px; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.16em; } h1 { max-width:760px; margin:0; font-family:"Songti SC","STSong","Noto Serif CJK SC",serif; font-size:clamp(38px,5vw,66px); letter-spacing:-.045em; line-height:1.04; } .lead { max-width:700px; margin:18px 0 34px; color:var(--muted); line-height:1.7; } figure { margin:0; padding:24px; border:1px solid var(--rule); border-radius:8px; background:var(--paper); } svg.diagram { display:block; width:100%; height:auto; } figcaption { display:flex; justify-content:space-between; gap:20px; margin-top:14px; color:var(--soft); font-size:13px; } .legend { color:var(--muted); } .legend b { color:var(--accent); } .connector { fill:none; stroke:var(--muted); stroke-width:2; marker-end:url(#arrow); } .node rect { fill:var(--paper); stroke:var(--rule); stroke-width:1.5; } .node .label { fill:var(--ink); font-size:16px; font-weight:700; } .node .skill-name { font-size:14px; } .node .detail { fill:var(--soft); font-size:12px; } .node .icon { color:var(--muted); } .node.accent rect { fill:var(--accent-tint); stroke:var(--accent); stroke-width:2; } .node.accent .label { fill:var(--accent); } .node.accent .icon { color:var(--accent); } .node.accent .detail { fill:var(--muted); }
</style>
<main>
  <p class="kicker">EDITORIAL V1 · LOCAL-ONLY EXAMPLE</p>
  <h1>六个 Skill 的本地视觉路由</h1>
  <p class="lead">由唯一的路由器判断表达层级与视觉类型，再把任务交给五个专用 Skill。橙色只标出路由决策，不为类别着色。</p>
  <figure>
    <svg class="diagram" viewBox="0 0 1160 650" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">六 Skill 视觉通信架构</title>
      <desc id="diagram-desc">visual-communication 作为唯一的路由器，连接 excalidraw-diagram、diagram-rendering、architecture-diagram、infographic 和 web-visual 五个专用 Skill。</desc>
      <defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7z" fill="#4f5d75"/></marker></defs>
      <rect width="1160" height="650" fill="#f5f5f5"/>
      <!-- Connectors are intentionally drawn before node backgrounds. -->
      <path class="connector" d="M480 210V300H120V390"/><path class="connector" d="M520 210V320H350V390"/><path class="connector" d="M580 210V390"/><path class="connector" d="M640 210V320H810V390"/><path class="connector" d="M680 210V300H1040V390"/>
      <g class="node accent"><rect x="440" y="90" width="280" height="120" rx="8"/><svg class="icon" x="468" y="116" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 12h5M13 12l3-4M13 12l3 4"/></svg><text class="label" x="508" y="135">visual-communication</text><text class="detail" x="468" y="172">选择表达层级与专用 Skill</text></g>
      <g class="node"><rect x="30" y="390" width="180" height="130" rx="8"/><svg class="icon" x="50" y="416" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18l4-4 3 3 6-7"/><path d="M4 5h16v14H4z"/></svg><text class="label skill-name" x="50" y="458">excalidraw-diagram</text><text class="detail" x="50" y="490">可编辑空间推演</text></g>
      <g class="node"><rect x="260" y="390" width="180" height="130" rx="8"/><svg class="icon" x="280" y="416" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19V5M5 19h14"/><path d="M8 15l4-5 3 3 4-6"/></svg><text class="label skill-name" x="280" y="458">diagram-rendering</text><text class="detail" x="280" y="490">本地结构图与图表</text></g>
      <g class="node"><rect x="490" y="390" width="180" height="130" rx="8"/><svg class="icon" x="510" y="416" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg><text class="label skill-name" x="510" y="458">architecture-diagram</text><text class="detail" x="510" y="490">离线系统架构</text></g>
      <g class="node"><rect x="720" y="390" width="180" height="130" rx="8"/><svg class="icon" x="740" y="416" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/><circle cx="4" cy="6" r=".5"/><circle cx="4" cy="12" r=".5"/><circle cx="4" cy="18" r=".5"/></svg><text class="label skill-name" x="740" y="458">infographic</text><text class="detail" x="740" y="490">信息摘要与传播</text></g>
      <g class="node"><rect x="950" y="390" width="180" height="130" rx="8"/><svg class="icon" x="970" y="416" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 9h16M8 7h.01M11 7h.01"/></svg><text class="label skill-name" x="970" y="458">web-visual</text><text class="detail" x="970" y="490">本地交互报告</text></g>
    </svg>
    <figcaption><span>路由器按最低充分复杂度选择一个 specialist；连接线先于节点绘制。</span><span class="legend"><b>橙色</b>＝唯一路由器</span></figcaption>
  </figure>
</main>

    <g><rect x="280" y="352" width="192" height="120" rx="8" fill="#f5f5f5" stroke="#bfc0c0"/><text x="376" y="396" fill="#2d3142" font-size="14" font-weight="700">diagram-rendering</text><text x="376" y="428" fill="#4f5d75" font-size="12">flows, topology, charts</text><text x="376" y="452" fill="#7a8399" font-family="Menlo, Monaco, monospace" font-size="10">LEVEL 2</text></g>
    <g><rect x="544" y="352" width="192" height="120" rx="8" fill="#f5f5f5" stroke="#bfc0c0"/><text x="640" y="396" fill="#2d3142" font-size="14" font-weight="700">architecture-diagram</text><text x="640" y="428" fill="#4f5d75" font-size="12">systems and boundaries</text><text x="640" y="452" fill="#7a8399" font-family="Menlo, Monaco, monospace" font-size="10">LEVEL 3</text></g>

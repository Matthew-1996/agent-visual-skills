<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线架构图模板</title>
<style>
  :root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#bfc0c0; --accent:#eb6c36; --link:#2e5aa8; color-scheme:light; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:var(--ink); background:var(--paper); }
  * { box-sizing:border-box; } body { margin:0; padding:clamp(24px,4vw,56px); background:var(--paper); } main { max-width:1280px; margin:auto; } h1 { font-family:"Songti SC","STSong","Noto Serif CJK SC",serif; font-size:clamp(32px,5vw,58px); letter-spacing:-.04em; } p { color:var(--muted); } .panel { padding:clamp(14px,2vw,24px); border:1px solid var(--rule); border-radius:8px; background:#fff; }
  svg { width:100%; height:auto; display:block; } .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:20px; } .card { border-top:1px solid var(--rule); padding-top:10px; color:var(--muted); } @media (max-width:640px) { .cards { grid-template-columns:1fr; } }
</style>
<main>
  <p>OFFLINE ARCHITECTURE · EDITORIAL V1</p><h1>系统架构</h1><p>离线单文件 · 使用内联 SVG 和系统字体</p>
  <section class="panel">
    <!-- 布局计划：在这里列出每个组件的 x,y,WxH 及连线。箭头必须在节点前绘制。 -->
    <svg viewBox="0 0 1200 700" role="img" aria-label="系统架构图">
      <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#4f5d75"/></marker></defs>
      <rect width="1200" height="700" fill="#f5f5f5"/>
      <!-- 边界、箭头、节点和图例依次放在这里。每个节点用不透明底遮挡箭头。 -->
    </svg>
  </section>
  <section class="cards"><article class="card">边界</article><article class="card">数据流</article><article class="card">运维</article></section>
</main>

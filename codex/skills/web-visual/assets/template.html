<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地 Web Visual 模板</title>
<style>
  :root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#bfc0c0; --accent:#eb6c36; --link:#2e5aa8; color-scheme:light; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:var(--ink); background:var(--paper); } *{box-sizing:border-box} body{margin:0;padding:clamp(24px,4vw,56px)} main{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--rule);padding-bottom:22px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em}h1{margin:8px 0 0;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:clamp(34px,5vw,60px);line-height:1.04;letter-spacing:-.04em}.updated,.muted,.foot{color:var(--muted)}.verdict{margin:26px 0 16px;padding:22px 0;border-bottom:1px solid var(--rule)}.verdict strong{color:var(--accent)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{min-height:38px;padding:0 14px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}button:focus-visible{outline:3px solid #eb6c3640;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{min-width:0;border-top:1px solid var(--rule);padding-top:12px}.card h2{margin:0 0 10px;font-size:16px}.metric{font-size:32px;font-weight:800}.diagram{grid-column:span 2}svg{display:block;width:100%;height:auto}.card[hidden]{display:none}.foot{margin-top:20px;font-size:12px}@media(max-width:680px){.top{display:block}.updated{margin-top:10px}.grid{grid-template-columns:1fr}.diagram{grid-column:auto}}
</style>
<main>
  <header class="top"><div><div class="eyebrow">LOCAL DECISION REPORT</div><h1>把结论放在首屏</h1></div><div class="updated">更新于：本地时间</div></header>
  <section class="verdict"><strong>结论</strong>：一句话说明当前状态、主要原因与建议行动。<div class="controls" aria-label="报告视角"><button type="button" aria-pressed="true" data-lens="all">总览</button><button type="button" aria-pressed="false" data-lens="risk">只看风险</button></div><div class="muted" data-lens-summary aria-live="polite">显示全部证据。</div></section>
  <section class="grid"><article class="card" data-topic="result"><h2>结果指标</h2><div class="metric">84%</div><p class="muted">写清单位、口径与目标差距。</p></article><article class="card" data-topic="risk"><h2>主要风险</h2><div class="metric">2</div><p class="muted">说明影响和触发条件。</p></article><article class="card" data-topic="action"><h2>下一步</h2><div class="metric">3 项</div><p class="muted">明确负责人和检查点。</p></article><article class="card diagram" data-topic="result"><h2>证据关系</h2><svg viewBox="0 0 720 250" role="img" aria-label="从证据到行动的关系"><path d="M210 125H330M390 125H510" stroke="#bfc0c0" stroke-width="2"/><g text-anchor="middle" fill="#2d3142"><circle cx="150" cy="125" r="64" fill="#ececec"/><text x="150" y="131" font-size="18" font-weight="700">证据</text><circle cx="360" cy="125" r="64" fill="#eb6c36"/><text x="360" y="131" fill="#fff" font-size="18" font-weight="700">判断</text><circle cx="570" cy="125" r="64" fill="#ececec"/><text x="570" y="131" font-size="18" font-weight="700">行动</text></g></svg></article><article class="card" data-topic="risk"><h2>风险边界</h2><p class="muted">记录假设、限制和可逆路径。</p></article></section>
  <footer class="foot">离线单文件 · 内联 CSS/SVG/JS · 无远程请求</footer>
</main>
<script>
  const buttons = [...document.querySelectorAll('[data-lens]')];
  const cards = [...document.querySelectorAll('[data-topic]')];
  const summary = document.querySelector('[data-lens-summary]');
  buttons.forEach(button => button.addEventListener('click', () => {
    const lens = button.dataset.lens;
    buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    cards.forEach(card => card.hidden = lens !== 'all' && card.dataset.topic !== lens);
    summary.textContent = lens === 'all' ? '显示全部证据。' : '已聚焦风险证据。';
  }));
</script>

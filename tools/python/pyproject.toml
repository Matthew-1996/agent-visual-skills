[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-renderer"
version = "0.1.0"
description = "Local-only renderer command contract"
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0"]

[project.scripts]
visual-render = "visual_renderer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

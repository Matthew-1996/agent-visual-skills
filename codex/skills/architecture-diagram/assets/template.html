<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线架构图模板</title>
<style>
  :root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#bfc0c0; --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); --link:#2e5aa8; color-scheme:light; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:var(--ink); background:var(--paper); }
  * { box-sizing:border-box; } body { margin:0; padding:clamp(24px,4vw,56px); background:var(--paper); } main { max-width:1280px; margin:auto; } h1 { font-family:"Songti SC","STSong","Noto Serif CJK SC",serif; font-size:clamp(32px,5vw,58px); letter-spacing:-.04em; } p { color:var(--muted); } .panel { padding:clamp(14px,2vw,24px); border:1px solid var(--rule); border-radius:8px; background:var(--paper); }
  svg { width:100%; height:auto; display:block; } .note { margin-top:20px; padding-top:12px; border-top:1px solid var(--rule); color:var(--soft); font-size:12px; }
</style>
<main>
  <p>OFFLINE ARCHITECTURE · EDITORIAL V1.1</p><h1>系统架构</h1><p>离线单文件 · 使用内联 SVG 和系统字体</p>
  <section class="panel">
    <!-- 4px 布局计划：在这里列出每个组件的 x,y,WxH 及连线。 -->
    <svg viewBox="0 0 1200 720" role="img" aria-labelledby="architecture-template-title architecture-template-desc">
      <title id="architecture-template-title">系统架构图</title>
      <desc id="architecture-template-desc">请在完成图表时用一句话说明主要组件、边界与流向。</desc>
      <defs><marker id="architecture-template-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#4f5d75"/></marker></defs>
      <rect width="1200" height="720" fill="#f5f5f5"/>
      <!-- 边界、圆角正交连线、节点、文字依次放置；图例留在边界外。 -->
    </svg>
  </section>
  <p class="note">图下注释只解释必要的边界、口径或省略项，不生成等宽摘要卡片。</p>
</main>

    <path d="M1144 144H1176V168H1144Z" fill="none" stroke="#4f5d75" stroke-width="2"/><path d="M1152 176H1168" stroke="#4f5d75" stroke-width="2"/>
    <text x="1160" y="208" fill="#2d3142" font-size="16" font-weight="700">DELIVER</text><text x="1160" y="232" fill="#7a8399" font-size="12">one local artifact</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="system-overview-title system-overview-desc">
  <title id="system-overview-title">Visual communication skill routing architecture</title>
  <desc id="system-overview-desc">Shared governance guides visual-communication, which routes to one of five specialist skills and produces a local editable artifact.</desc>
  <defs><marker id="system-overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker></defs>
  <rect x="1" y="1" width="1278" height="598" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="2"/>
  <text x="40" y="44" fill="#7a8399" font-family="Menlo, Monaco, monospace" font-size="12" font-weight="700" letter-spacing="2">ONE ROUTER · FIVE SPECIALISTS · ONE LOCAL DELIVERY CONTRACT</text>

  <g fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#system-overview-arrow)">
    <path d="M280 136H456"/><path d="M1000 136H824"/>
    <path d="M520 224V284Q520 292 512 292H144Q136 292 136 300V352"/>
    <path d="M576 224V312Q576 320 568 320H384Q376 320 376 328V352"/>
    <path d="M640 224V352"/>

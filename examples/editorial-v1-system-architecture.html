<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial V1 系统架构示例</title>
<style>
  :root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#bfc0c0; --accent:#eb6c36; --link:#2e5aa8; color-scheme:light; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:var(--ink); background:var(--paper); }
  * { box-sizing:border-box; } body { margin:0; padding:56px clamp(28px,6vw,96px); background:var(--paper); } main { max-width:1280px; margin:auto; } .kicker { margin:0 0 12px; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.16em; } h1 { max-width:760px; margin:0; font-family:"Songti SC","STSong","Noto Serif CJK SC",serif; font-size:clamp(38px,5vw,66px); letter-spacing:-.045em; line-height:1.04; } .lead { max-width:700px; margin:18px 0 34px; color:var(--muted); line-height:1.7; } figure { margin:0; padding:24px; border:1px solid var(--rule); border-radius:8px; background:#fff; } svg.diagram { display:block; width:100%; height:auto; } figcaption { display:flex; justify-content:space-between; gap:20px; margin-top:14px; color:var(--soft); font-size:13px; } .legend { color:var(--muted); } .legend b { color:var(--accent); } .connector { fill:none; stroke:var(--muted); stroke-width:2; marker-end:url(#arrow); } .node rect { fill:#fff; stroke:var(--rule); stroke-width:1.5; } .node .label { fill:var(--ink); font-size:17px; font-weight:700; } .node .detail { fill:var(--soft); font-size:12px; } .node .icon { color:var(--muted); } .node.accent rect { fill:rgba(235,108,54,.08); stroke:var(--accent); stroke-width:2; } .node.accent .label, .node.accent .icon { color:var(--accent); fill:var(--accent); } .node.accent .detail { fill:var(--muted); }
</style>
<main>
  <p class="kicker">EDITORIAL V1 · LOCAL-ONLY EXAMPLE</p>
  <h1>一条克制的数据决策路径</h1>
  <p class="lead">从客户请求到决策输出，只保留理解系统责任、数据流与审计边界所需的六个节点。橙色聚焦唯一的判断环节。</p>
  <figure>
    <svg class="diagram" viewBox="0 0 1160 650" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">Editorial V1 系统架构</title>
      <desc id="diagram-desc">客户入口经由接入网关进入决策服务，决策服务读取数据存储并记录审计事件；同意校验控制数据访问。</desc>
      <defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7z" fill="#4f5d75"/></marker></defs>
      <rect width="1160" height="650" fill="#f5f5f5"/>
      <!-- Connectors are intentionally drawn before node backgrounds. -->
      <path class="connector" d="M216 220H294"/><path class="connector" d="M494 220H570"/><path class="connector" d="M770 220H842V390"/><path class="connector" d="M952 510V578H870"/><path class="connector" d="M670 300V390H482"/><path class="connector" d="M482 470V540H670"/>
      <g class="node"><rect x="36" y="160" width="180" height="120" rx="8"/><svg class="icon" x="64" y="186" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg><text class="label" x="104" y="205">客户入口</text><text class="detail" x="64" y="242">请求与身份</text></g>
      <g class="node"><rect x="294" y="160" width="200" height="120" rx="8"/><svg class="icon" x="322" y="186" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v10H4z"/><path d="M8 11h8M8 15h5"/></svg><text class="label" x="362" y="205">接入网关</text><text class="detail" x="322" y="242">鉴权与路由</text></g>
      <g class="node accent"><rect x="570" y="160" width="200" height="120" rx="8"/><svg class="icon" x="598" y="186" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v14H5z"/><path d="M8 12h8M12 8v8"/></svg><text class="label" x="638" y="205">决策服务</text><text class="detail" x="598" y="242">规则与模型</text></g>
      <g class="node"><rect x="842" y="390" width="220" height="120" rx="8"/><svg class="icon" x="870" y="416" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 2 14 2 14 0V6M5 12c0 2 14 2 14 0"/></svg><text class="label" x="910" y="435">数据存储</text><text class="detail" x="870" y="472">特征与记录</text></g>
      <g class="node"><rect x="282" y="390" width="200" height="120" rx="8"/><svg class="icon" x="310" y="416" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="10" width="12" height="9" rx="2"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg><text class="label" x="350" y="435">同意校验</text><text class="detail" x="310" y="472">访问边界</text></g>
      <g class="node"><rect x="670" y="540" width="200" height="76" rx="8"/><svg class="icon" x="698" y="566" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16H7z"/><path d="M10 8h4M10 12h4M10 16h4"/></svg><text class="label" x="738" y="585">审计事件</text></g>
    </svg>
    <figcaption><span>连接线先于节点绘制；节点遮挡无关线路。</span><span class="legend"><b>橙色</b>＝当前焦点</span></figcaption>
  </figure>
</main>

    <path d="M760 224V284Q760 292 768 292H1136Q1144 292 1144 300V352"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="40" y="88" width="240" height="96" rx="8" fill="#f5f5f5" stroke="#bfc0c0"/><text x="64" y="124" fill="#2d3142" font-size="16" font-weight="700">Shared governance</text><text x="64" y="152" fill="#4f5d75" font-size="13">privacy · selection · acceptance</text>
    <rect x="456" y="64" width="368" height="160" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="2"/><text x="480" y="108" fill="#eb6c36" font-size="20" font-weight="700">visual-communication</text><text x="480" y="144" fill="#4f5d75" font-size="14">Is a visual worth the reader's attention?</text><text x="480" y="172" fill="#4f5d75" font-size="14">Choose exactly one lowest-sufficient specialist.</text><text x="480" y="200" fill="#7a8399" font-family="Menlo, Monaco, monospace" font-size="11">LEVEL 1 / LEVEL 2 / LEVEL 3</text>
    <rect x="1000" y="88" width="240" height="96" rx="8" fill="#f5f5f5" stroke="#bfc0c0"/><text x="1024" y="124" fill="#2d3142" font-size="16" font-weight="700">Editorial v1.1</text><text x="1024" y="152" fill="#4f5d75" font-size="13">tokens · geometry · optical QA</text>
  </g>


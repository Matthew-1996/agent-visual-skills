[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-renderer"
version = "0.1.0"
description = "Local-only renderer command contract"
requires-python = ">=3.9"
dependencies = [
    "Pillow==11.3.0; python_version < '3.10'",
    "Pillow==12.3.0; python_version >= '3.10'",
    "matplotlib==3.9.4; python_version < '3.10'",
    "matplotlib==3.10.9; python_version == '3.10'",
    "matplotlib==3.11.1; python_version >= '3.11'",
    "playwright==1.60.0; python_version < '3.10'",
    "playwright==1.62.0; python_version >= '3.10'",
]

[project.scripts]
visual-render = "visual_renderer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

<title>Editorial v1.1 系统架构示例</title>
<style>
  :root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#bfc0c0; --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); --link:#2e5aa8; color-scheme:light; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:var(--ink); background:var(--paper); }
  * { box-sizing:border-box; } body { margin:0; padding:56px clamp(28px,6vw,96px); background:var(--paper); } main { max-width:1280px; margin:auto; } .kicker { margin:0 0 12px; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.16em; } h1 { max-width:760px; margin:0; font-family:"Songti SC","STSong","Noto Serif CJK SC",serif; font-size:clamp(38px,5vw,66px); letter-spacing:-.045em; line-height:1.04; } .lead { max-width:700px; margin:18px 0 34px; color:var(--muted); line-height:1.7; } figure { margin:0; padding:24px; border:1px solid var(--rule); border-radius:8px; background:var(--paper); } svg.diagram { display:block; width:100%; height:auto; } figcaption { display:flex; justify-content:space-between; gap:20px; margin-top:14px; color:var(--soft); font-size:13px; } .legend { color:var(--muted); } .legend b { color:var(--accent); } .connector { fill:none; stroke:var(--muted); stroke-width:2; marker-end:url(#editorial-v11-arrow); } .node rect { fill:var(--paper); stroke:var(--rule); stroke-width:1.5; } .node .label { fill:var(--ink); font-size:16px; font-weight:700; } .node .skill-name { font-size:14px; } .node .detail { fill:var(--soft); font-size:12px; } .node .icon { color:var(--muted); } .node.accent rect { fill:var(--accent-tint); stroke:var(--accent); stroke-width:2; } .node.accent .label { fill:var(--accent); } .node.accent .icon { color:var(--accent); } .node.accent .detail { fill:var(--muted); }
</style>
